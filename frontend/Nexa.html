<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexa · Welcome</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#e0e0e6; --ink:#23222b; --muted:#6b6a78; --glass:rgba(255,255,255,.5); --edge:rgba(255,255,255,.8); --shade:rgba(60,55,90,.16);
  --iri:linear-gradient(120deg,#8fb7ff,#c9a6ff,#ffb3d1,#ffd9a0);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15141b;--ink:#f0eff6;--muted:#a3a2b3;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.16);--shade:rgba(0,0,0,.5);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15141b;--ink:#f0eff6;--muted:#a3a2b3;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.16);--shade:rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #8f7bff;outline-offset:3px}

/* live orb */
.orb{position:fixed;left:50%;top:38%;width:min(120vw,780px,96vh);aspect-ratio:1;z-index:0;pointer-events:none;animation:orbin 1.4s ease .1s both;
  transform:translate(calc(-50% + var(--px,0px)),calc(-50% + var(--py,0px)));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.orb video{width:100%;height:100%;display:block;object-fit:cover;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 34%,transparent 66%);mask-image:radial-gradient(circle at 50% 50%,#000 34%,transparent 66%)}

#root{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,56px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:18px}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--iri);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 4px 10px var(--shade)}
.btn{padding:12px 24px;border-radius:999px;font-weight:500;font-size:15px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px -10px var(--shade)}
.btn.iri{background:var(--iri);color:#23222b;font-weight:700;box-shadow:0 12px 28px -10px rgba(143,123,255,.7),inset 0 1px 0 rgba(255,255,255,.7)}

.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 22px clamp(28px,6vh,64px);gap:18px}
.tag{padding:6px 14px;border-radius:999px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
h1{margin:0;font-size:clamp(38px,7vw,72px);line-height:1.02;letter-spacing:-.03em;max-width:14ch}
h1 em{font-style:normal;background:var(--iri);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;max-width:44ch;color:var(--muted);line-height:1.6;font-size:16px}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pill{padding:9px 16px;border-radius:999px;font-size:13px;color:var(--muted);background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* sign-in sheet */
.scrim{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(30,28,50,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s both}
.sheet{width:min(400px,100%);padding:28px;border-radius:28px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);box-shadow:0 30px 60px -20px var(--shade);animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
.sheet h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.sheet p{margin:0 0 18px;color:var(--muted);font-size:14px}
.sheet label{display:grid;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px}
.sheet input{border:1px solid var(--edge);background:var(--glass);border-radius:14px;padding:13px 16px;font-size:15px}
.sheet .row{display:flex;gap:10px;margin-top:6px}
.sheet .row .btn{flex:1}
.ok{color:#2f8f6b;font-size:14px;margin-top:12px}
.sheet .err{color:#c0392b;font-size:14px;margin:0 0 12px}
.sheet .agree{display:flex;align-items:flex-start;gap:10px;font-size:13px;margin-bottom:12px;cursor:pointer}
.sheet .agree input{width:18px;height:18px;padding:0;margin-top:1px;flex:none;accent-color:#7458e6}
.sheet .linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.sheet .terms{max-height:130px;overflow:auto;font-size:12px;border:1px solid var(--edge);border-radius:14px;padding:10px 14px;margin-bottom:12px;color:var(--muted)}
.sheet .terms p{font-size:12px;margin:0 0 8px}
.sheet .switch{margin:14px 0 0;text-align:center;font-size:13px}
.hero{min-height:calc(100svh - 80px)}
.hero>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero>*:nth-child(1){animation-delay:.15s}.hero>*:nth-child(2){animation-delay:.28s}.hero>*:nth-child(3){animation-delay:.4s}.hero>*:nth-child(4){animation-delay:.52s}.hero>*:nth-child(5){animation-delay:.64s}
.float{position:absolute;z-index:1;padding:14px 18px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 40px -16px var(--shade);font-size:13px;color:var(--muted);animation:bob 6s ease-in-out infinite}
.float b{display:block;font-size:20px;letter-spacing:-.02em;color:var(--ink);margin-top:2px}
.float .mini{height:6px;border-radius:99px;background:var(--edge);margin-top:10px;overflow:hidden;width:120px}
.float .mini i{display:block;height:100%;width:72%;background:var(--iri)}
.f1{left:max(4vw,calc(50% - 500px));top:26vh}
.f2{right:max(4vw,calc(50% - 500px));top:44vh;animation-delay:-3s}
.steps{max-width:1000px;margin:0 auto;width:100%;padding:56px 22px 110px}
.stitle{text-align:center;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin:0 0 28px}
.stepgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.step{padding:24px;border-radius:26px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 40px -20px var(--shade)}
.step b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--iri);color:#23222b;margin-bottom:14px}
.step h3{margin:0 0 6px;font-size:18px}
.step p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.btn.wide{width:100%}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--edge)}
@keyframes orbin{from{opacity:0}to{opacity:1}}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (max-width:900px){.float{display:none}}
@media (max-width:560px){.scrim{place-items:end center;padding:0}.sheet{border-radius:28px 28px 0 0;width:100%;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.hero>*,.float,.orb{animation:none}}
.inapp .orb{display:none}
body.inapp{background:#e0e0e6}
:root[data-theme="dark"] body.inapp{background:#15141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.inapp{background:#15141b}}
.dash{--nbg:#e0e0e6;--nsl:#f6f6fb;--nsd:#bebdcc;--nink:#23222b;--ntitle:#6b6a78;--nmut:#6b6a78;--ncy:#7458e6;--ncy1:#8fb7ff;--ncy2:#c9a6ff;--npu:#ffb3d1;--non:#23222b;--nglow:143,123,255;
  --raise:9px 9px 18px var(--nsd),-9px -9px 18px var(--nsl);--rsm:5px 5px 10px var(--nsd),-5px -5px 10px var(--nsl);--inset:inset 4px 4px 8px var(--nsd),inset -4px -4px 8px var(--nsl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dash{--nbg:#15141b;--nsl:rgba(255,255,255,.05);--nsd:rgba(0,0,0,.6);--nink:#f0eff6;--ntitle:#a3a2b3;--nmut:#a3a2b3;--ncy:#b9a6ff;--ncy1:#8fb7ff;--ncy2:#c9a6ff;--npu:#ffb3d1}}
:root[data-theme="dark"] .dash{--nbg:#15141b;--nsl:rgba(255,255,255,.05);--nsd:rgba(0,0,0,.6);--nink:#f0eff6;--ntitle:#a3a2b3;--nmut:#a3a2b3;--ncy:#b9a6ff;--ncy1:#8fb7ff;--ncy2:#c9a6ff;--npu:#ffb3d1}
.dash{min-height:100svh;padding:34px 22px 56px;display:grid;place-items:start center;background:var(--nbg);color:var(--nink);animation:fade .5s both}
.dpanel{width:min(1100px,100%)}
.nhead{display:flex;flex-wrap:wrap;gap:14px 18px;justify-content:space-between;align-items:center;margin-bottom:26px}
.nlogo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ntitle)}
.nsub{font-size:12px;color:var(--nmut);font-weight:400;margin-left:2px}
.nin{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--nbg);color:var(--ncy);box-shadow:var(--rsm);flex:none}
.nin.sm{width:36px;height:36px}.nin.xs{width:28px;height:28px;font-size:12px;font-weight:700}
.nseg{display:inline-flex;padding:5px;border-radius:99px;background:var(--nbg);box-shadow:var(--inset)}
.nseg button{padding:7px 18px;border-radius:99px;font-size:13px;color:var(--nmut)}
.nseg button[aria-pressed='true']{background:var(--nbg);color:var(--ncy);font-weight:700;box-shadow:var(--rsm)}
.nseg.sm button{padding:4px 12px;font-size:12px}
.dash .btn{transition:box-shadow .2s,transform .2s}
.dash .btn.iri{background:var(--iri);color:var(--non);box-shadow:var(--rsm)}
.dash .btn.glass{background:var(--nbg);border:0;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--nink);box-shadow:var(--rsm)}
.dash .btn:active{box-shadow:var(--inset);transform:none}
.nbtn{padding:9px 20px;font-size:13px}
.dact{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dpill{padding:9px 18px;border-radius:99px;font-size:13px;background:var(--nbg);color:var(--nink);box-shadow:var(--rsm)}
.dpill:active{box-shadow:var(--inset)}
.dlab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ntitle);font-weight:700;display:block}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-bottom:24px}
.kpi{display:flex;align-items:center;gap:16px;padding:20px 18px;border-radius:28px;background:var(--nbg);box-shadow:var(--raise)}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;margin:4px 0 2px;color:var(--nink)}
.kpi small{display:block;font-size:11.5px;color:var(--nmut);line-height:1.5}
.kpi .kd{color:var(--ncy)}
.nring{position:relative;width:82px;height:82px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--nbg);box-shadow:var(--rsm)}
.nring svg{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px)}
.rt{fill:none;stroke:var(--nsd);stroke-width:7;opacity:.45}
.rf{fill:none;stroke:var(--ncy);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.nring .nin{width:40px;height:40px}

.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.dc{padding:22px;border-radius:30px;background:var(--nbg);box-shadow:var(--raise);display:flex;flex-direction:column;gap:14px;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.span2{grid-column:span 2}
.dc p{margin:0;font-size:13px;line-height:1.6;color:var(--nmut)}
.ct{display:flex;align-items:center;gap:12px}
.ct .nseg,.ct .nleg{margin-left:auto}
.nleg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--nmut)}
.nleg i{width:10px;height:10px;border-radius:50%;background:var(--ncy)}.nleg i.fc{background:var(--npu);margin-left:8px}

.nbars{display:flex;gap:14px;align-items:stretch;height:230px;padding:4px 6px 0}
.ncol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.ncol b{font-size:12px;color:var(--nink)}.ncol span{font-size:11px;color:var(--nmut);letter-spacing:.06em}
.ntrack{flex:1;width:min(30px,100%);border-radius:99px;background:var(--nbg);box-shadow:var(--inset);display:flex;align-items:flex-end;padding:4px}
.ntrack i{display:block;width:100%;border-radius:99px;background:linear-gradient(180deg,var(--ncy1),var(--ncy2));box-shadow:0 0 12px rgba(var(--nglow),.4);transition:height .7s cubic-bezier(.2,.7,.2,1)}
.ntrack i.fc{background:linear-gradient(180deg,#ffd9a0,var(--npu));box-shadow:none}

.dbar{height:12px;border-radius:99px;background:var(--nbg);box-shadow:var(--inset);padding:2px;overflow:hidden}
.dbar.thin{height:10px;padding:2px}
.dbar i{display:block;height:100%;border-radius:99px;background:var(--iri);box-shadow:0 0 8px rgba(var(--nglow),.35)}
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.nrow2{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:7px}
.nrow2 span:last-child{color:var(--nmut)}
.ntag{font-style:normal;font-size:10px;margin-left:8px;padding:2px 9px;border-radius:99px;background:var(--iri);color:var(--non);letter-spacing:.05em}
.nrecs{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.nrecs li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--nbg);box-shadow:var(--rsm)}
.nrecs b{font-size:14px;color:var(--nink)}.nrecs p{margin-top:2px}
.nrecs li.done{box-shadow:var(--inset);opacity:.7}.nrecs li.done p{text-decoration:line-through}
.pri{font-size:11px;padding:5px 12px;border-radius:99px;font-weight:700;min-width:64px;text-align:center}
.pri.high{background:var(--iri);color:var(--non)}
.pri.medium{background:var(--npu);color:var(--non)}
.pri.low{background:var(--nbg);box-shadow:var(--inset);color:var(--nmut)}
.dmini{padding:7px 16px;border-radius:99px;font-size:12px;color:var(--ncy);font-weight:700;background:var(--nbg);box-shadow:var(--rsm)}
.dmini:active,.dmini[aria-pressed='true']{box-shadow:var(--inset)}
.dmini:disabled{color:var(--nmut);box-shadow:var(--inset);cursor:default}
.nstock{display:grid;gap:4px}.nstock .dmini{justify-self:start;margin-top:6px}

.nscn{display:flex;gap:14px;justify-content:space-between}
.nscn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--nmut)}
.nscn i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:700;color:var(--nmut);background:var(--nbg);box-shadow:var(--rsm);transition:.2s}
.nscn button[aria-pressed='true'] i{box-shadow:var(--inset);color:var(--ncy)}
.nscn button[aria-pressed='true']{color:var(--nink)}
.dbig{font-size:32px;letter-spacing:-.02em;color:var(--ncy);display:block}

.npill{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:99px;background:var(--nbg);box-shadow:var(--rsm);font-size:13px}
.npill b{margin-left:auto;font-variant-numeric:tabular-nums}
.chipS{padding:3px 10px;border-radius:99px;font-size:11px;background:var(--nbg);box-shadow:var(--inset);color:var(--nmut)}
.chipS.paid{color:var(--ncy)}
.nnote{margin:22px 0 0;font-size:12px;color:var(--nmut);text-align:center}

.dash .scrim{background:rgba(30,28,50,.25)}
.dash .sheet{background:var(--nbg);border:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:var(--raise);color:var(--nink)}
.dash .sheet p,.dash .sheet label{color:var(--nmut)}
.dash .sheet input{background:var(--nbg);border:0;box-shadow:var(--inset);color:var(--nink)}
.dash .sheet .nseg button[aria-pressed='true']{color:var(--ncy)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.dgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.dash{padding:22px 14px 40px}.nbars{gap:8px}}

.dpanel{width:auto}

.dash{place-items:start center}

.ngrp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--nmut);padding:12px 10px 4px}

@media (max-width:900px){
  .nshell{grid-template-columns:1fr}
  .dash{padding-bottom:110px}
  .nside{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;z-index:6;flex-direction:row;gap:4px;padding:8px;border-radius:26px;overflow-x:auto}
  .nside .nlogo,.ngrp{display:none}
  .nnav{flex-direction:column;gap:4px;padding:6px 10px;border-radius:18px;font-size:10px;flex:none}
  .kpis.three{grid-template-columns:1fr}
  .span3{grid-column:auto}
}
.nform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:end}
.nform label{display:grid;gap:6px;font-size:12px;color:var(--nmut)}
.nform input,.nform select{border:0;background:var(--nbg);box-shadow:var(--inset);border-radius:16px;padding:12px 16px;font:inherit;font-size:14px;color:var(--nink);width:100%}
.nok{color:var(--ncy)!important;font-weight:700}
.nbatch{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:24px;background:var(--nbg);box-shadow:var(--rsm)}
.nbatch .nrow2.sub{margin:8px 0 0;font-size:12px;gap:14px;flex-wrap:wrap}
.chipS.late{color:#e0795f;font-weight:700}
.nbars.short{height:190px}
@media (max-width:640px){.nbatch{flex-direction:column;align-items:stretch}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.orb,.btn,.scrim,.sheet{transition:none;animation:none}}
@media (max-width:560px){.orb{top:36%}.sub{font-size:15px}}
</style>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const API = window.NEXA_API || "http://localhost:8000/api";
const TOKEN_KEY = "nexa_token";
async function call(path, body, token) {
  let r;
  try {
    r = await fetch(API + path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw new Error("Cannot reach the server. Start the backend and try again.");
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function Sheet({ mode, onClose, onEnter, onSwitch }) {
  const [f, setF] = useState({ username: "", password: "", password2: "", terms: false });
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [showTerms, setShowTerms] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    ref.current && ref.current.focus();
    const esc = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, []);
  const signup = mode === "signup";
  const set = (k) => (e) => setF({ ...f, [k]: k === "terms" ? e.target.checked : e.target.value });
  const submit = async (e) => {
    e.preventDefault();
    setErr("");
    if (signup) {
      if (f.password !== f.password2) return setErr("The passwords do not match.");
      if (!f.terms) return setErr("You must accept the terms and conditions.");
    }
    setBusy(true);
    try {
      const res = await call(signup ? "/auth/register/" : "/auth/login/",
        signup ? { username: f.username, password: f.password, password2: f.password2, accepted_terms: f.terms }
               : { username: f.username, password: f.password });
      localStorage.setItem(TOKEN_KEY, res.token);
      onEnter(res.user);
    } catch (x) {
      setErr(x.message);
    }
    setBusy(false);
  };
  return (
    <div className="scrim" onClick={onClose}>
      <form className="sheet" role="dialog" aria-modal="true" aria-labelledby="st"
        onClick={(e) => e.stopPropagation()} onSubmit={submit} noValidate>
        <h2 id="st">{signup ? "Create your Nexa account" : "Welcome back"}</h2>
        <p>{signup ? "Choose a username and password." : "Sign in with your username and password."}</p>
        <label>Username
          <input ref={ref} type="text" required autoComplete="username" value={f.username} onChange={set("username")} />
        </label>
        <label>Password
          <input type="password" required autoComplete={signup ? "new-password" : "current-password"} value={f.password} onChange={set("password")} />
        </label>
        {signup && (
          <label>Re-enter password
            <input type="password" required autoComplete="new-password" value={f.password2} onChange={set("password2")} />
          </label>
        )}
        {signup && (
          <>
            <label className="agree">
              <input type="checkbox" checked={f.terms} onChange={set("terms")} />
              <span>I accept the <button type="button" className="linkbtn" onClick={() => setShowTerms(!showTerms)}>terms and conditions</button></span>
            </label>
            {showTerms && (
              <div className="terms">
                <p>1. Nexa helps you record and review your business activity. You are responsible for the accuracy of what you enter.</p>
                <p>2. Keep your password private. You are responsible for activity on your account.</p>
                <p>3. We store your account and business records to run the service and do not sell them.</p>
                <p>4. Forecasts and ideas are estimates, not financial advice.</p>
              </div>
            )}
          </>
        )}
        {err && <p className="err" role="alert">{err}</p>}
        <div className="row">
          <button type="button" className="btn glass" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn iri" disabled={busy}>{busy ? "Please wait…" : signup ? "Create account" : "Sign in"}</button>
        </div>
        <p className="switch">
          {signup ? "Already have an account? " : "New to Nexa? "}
          <button type="button" className="linkbtn" onClick={() => onSwitch(signup ? "signin" : "signup")}>{signup ? "Sign in" : "Create one"}</button>
        </p>
      </form>
    </div>
  );
}

function smoothPath(p) {
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
    d += ` C${b[0] + (c[0] - a[0]) / 6},${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6},${c[1] - (e[1] - b[1]) / 6} ${c[0]},${c[1]}`;
  }
  return d;
}
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
const NOW = new Date();
const CUR = NOW.toLocaleString('en-US', { month: 'short' });
const CUR_NEXT = new Date(NOW.getFullYear(), NOW.getMonth() + 1, 1).toLocaleString('en-US', { month: 'short' });
const TODAY = CUR + ' ' + NOW.getDate();
const MONTHS = [CUR];

const DATA = { [CUR]: { rev: 0, cogs: 0, exp: 0, series: [0, 0, 0, 0], top: [] } };
const SC = { Conservative: 0.97, Expected: 1.08, Optimistic: 1.2 };
const CATS = [];
const RECS = [];

const IC = {
  rev: 'M12 3v18M16 7h-5.5a2.5 2.5 0 000 5h3a2.5 2.5 0 010 5H8',
  gross: 'M5 20V11M12 20V4M19 20v-6',
  exp: 'M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l12-3v3M17 14h2',

      const bmax = Math.max(...buckets.map((x) => x[1]), 1);
      const watch = live.filter((b) => b[4] <= limit && b[4] > limit * 0.7);
      const list = [...slow, ...watch];
      const tip = (b) => (b[4] > limit * 2 ? 'Clear it: 25% off or put it in a bundle.' : b[4] > limit ? 'Try 15% off or pair it with a best seller.' : 'Close to the limit. Give it a push.');
      return (
        <>
          <div className='kpis'>
            {[['Batches too old', slow.length, `older than ${limit} days`], ['Units stuck', units, 'still on the shelf'], ['Money tied up', money(tied), 'at cost price'], ['Oldest stock', oldest + ' days', 'since it arrived']].map(([l, v, s]) => (
              <div className='kpi flat' key={l}><span className='dlab'>{l}</span><b>{v}</b><small>{s}</small></div>
            ))}
          </div>
          <div className='dgrid'>
            <section className='dc'>
              <Title ic={IC.gross}>Stock age, units left</Title>
              <div className='nbars short' role='img' aria-label={'Units left by age: ' + buckets.map((x) => x[0] + ' days ' + x[1]).join(', ')}>
                {buckets.map(([l, u], i) => (
                  <div className='ncol' key={l}>
                    <b>{u}</b>
                    <div className='ntrack'><i className={i === 0 ? '' : 'fc'} style={{ height: (u / bmax) * 100 + '%' }} /></div>
                    <span>{l}d</span>
                  </div>
                ))}
              </div>
            </section>
            <section className='dc span2'>
              <Title ic={NAV.find((x) => x[0] === 'slow')[2]} right={
                <div className='nseg sm' role='group' aria-label='Too long after how many days'>
                  {[30, 45, 60, 90].map((d) => <button key={d} aria-pressed={limit === d} onClick={() => setLimit(d)}>{d}d</button>)}
                </div>}>Sitting longer than {limit} days</Title>
              {list.length === 0 && <p>Nothing is sitting too long. Nice work.</p>}
              {list.map((b) => {
                const sd = Math.round(((b[2] - b[3]) / b[2]) * 100);
                return (
                  <div className='nbatch' key={b[0]}>
                    <div className='grow'>
                      <div className='nrow2'><span><b>{b[1]}</b> <span className='nmut'>· {b[6]}</span></span><span className={'chipS ' + (b[4] > limit ? 'late' : 'pend')}>{b[4]} days</span></div>
                      <Bar pct={sd} />
                      <div className='nrow2 sub'><span>{sd}% sold, {b[3]} left, {money(b[3] * b[5])} tied up</span><span>{tip(b)}</span></div>
                    </div>
                    <button className='dmini' aria-pressed={!!disc[b[0]]} onClick={() => setDisc({ ...disc, [b[0]]: !disc[b[0]] })}>{disc[b[0]] ? 'Discount on ✓' : 'Mark discounted'}</button>
                  </div>
                );
              })}
            </section>
          </div>
        </>
      );
    },

    expenses: () => (
      <div className='dgrid'>
        <section className='dc span2'>
          <Title ic={IC.exp} right={<b className='dbig sm'>{money(exp)}</b>}>Expenses by category, {m}</Title>
          {cats.length === 0 && add.exp === 0 && <p>No expenses recorded yet.</p>}
          {cats.map(([n, v]) => (
            <div className='nstock' key={n}><div className='nrow2'><span>{n}</span><span>{money(v)}</span></div><Bar pct={(v / maxCat) * 100} /></div>
          ))}
          {add.exp > 0 && <div className='nstock'><div className='nrow2'><span>Added by you</span><span>{money(add.exp)}</span></div><Bar pct={(add.exp / maxCat) * 100} /></div>}
        </section>
        <section className='dc'>
          <Title ic={IC.receipt}>Added by you</Title>
          {expList.length === 0 && <p>Nothing yet. Use + Expense to record one.</p>}
          {expList.map(([w, a, d], i) => <div className='npill' key={w + i}><span className='nin xs'>{w[0]}</span><span>{w}</span><span className='nmut'>{d}</span><b>{money(a)}</b></div>)}
        </section>
      </div>
    ),

    customers: () => {
      const map = {};
      sales.forEach(([w, a, , d]) => { const c = map[w] || (map[w] = [w, 0, 0, d]); c[1]++; c[2] += a; });
      const cust = Object.values(map);
      return (
      <section className='dc'>
        <Title ic={NAV.find((x) => x[0] === 'customers')[2]}>Customers</Title>
        {cust.length === 0 && <p>No customers yet. They appear as you record sales.</p>}
        {cust.map(([n, o, sp, last]) => (
          <div className='npill' key={n}>
            <span className='nin xs'>{n[0]}</span><span>{n}</span><span className='nmut'>{o} orders · last {last}</span><b>{money(sp)}</b>
          </div>
        ))}
      </section>
      );
    },

    reports: () => (
      <section className='dc'>
        <Title ic={NAV.find((x) => x[0] === 'reports')[2]}>Monthly reports</Title>
        <div className='nscroll'><div className='ntable'>
          <div className='nth r'><span>Period</span><span>Revenue</span><span>Expenses</span><span>Gross profit</span><span>Net profit</span></div>
          {MONTHS.map((x) => {
            const d = DATA[x], a = x === CUR ? extra : { rev: 0, cogs: 0, exp: 0 };
            const r = d.rev + a.rev, e = d.exp + a.exp, g = r - d.cogs - a.cogs;
            return <div className='ntr r' key={x}><b>{x} 2026</b><span>{money(r)}</span><span>{money(e)}</span><span>{money(g)}</span><span className='ncy'>{money(g - e)}</span></div>;
          })}
        </div></div>
      </section>
    ),

    insights: () => (
      <div className='dgrid'>
        <section className='dc span2'>
          <Title ic={IC.bulb} right={<div className='nseg sm' role='group' aria-label='Filter by priority'>
            {['All', 'High'].map((p) => <button key={p} aria-pressed={pri === p} onClick={() => setPri(p)}>{p}</button>)}</div>}>Smart ideas for you</Title>
          <ul className='nrecs'>
            {recs.length === 0 && <li><p>No ideas yet. They will show up as your data grows.</p></li>}
            {recs.map((r) => (
              <li key={r.id} className={done[r.id] ? 'done' : ''}>
                <span className={'pri ' + r.pri.toLowerCase()}>{r.pri}</span>
                <div><b>{r.cat}</b><p>{r.text}</p></div>
                <button className='dmini' aria-pressed={!!done[r.id]} onClick={() => setDone({ ...done, [r.id]: !done[r.id] })}>{done[r.id] ? 'Undo' : 'Done'}</button>
              </li>
            ))}
          </ul>
        </section>
        <section className='dc'>
          <Title ic={IC.net}>Forecast for {NEXT[m]}</Title>
          <div className='nscn' role='group' aria-label='Scenario'>
            {Object.keys(SC).map((s) => <button key={s} aria-pressed={scn === s} onClick={() => setScn(s)}><i>{s[0]}</i><span>{s}</span></button>)}
          </div>
          <b className='dbig'>{money(nextTotal)}</b>
          <p>{((factor - 1) * 100 >= 0 ? '+' : '') + ((factor - 1) * 100).toFixed(0)}% on {m}. Based on your weekly trend and best sellers.</p>
        </section>
        <section className='dc span3'>
          <Title ic={IC.gross} right={<span className='nleg'><i />Actual<i className='fc' />Forecast</span>}>Sales by week, {m}</Title>
          <Trend series={series} next={nextWeek} key={m + scn + extra.rev} />
        </section>
      </div>
    ),
  };

  const cur = NAV.find((n) => n[0] === nav);
  const showMonth = ['overview', 'products', 'expenses', 'insights'].includes(nav);
  const go = (id) => { setNav(id); setQ(''); window.scrollTo(0, 0); };

  return (
    <div className='dash'>
      <div className='nshell'>
        <nav className='nside' aria-label='Main menu'>
          <div className='nlogo'><span className='nin sm'><Ico d={IC.gross} s={18} /></span>Nexa</div>
          <span className='ngrp'>Menu</span>
          {NAV.map(([id, label, ic], i) => (
            <React.Fragment key={id}>
              {id === 'sales' && <span className='ngrp'>Libraries</span>}
              <button className='nnav' aria-current={nav === id ? 'page' : undefined} onClick={() => go(id)}>
                <span className='nin'><Ico d={ic} s={17} /></span><span className='nlab'>{label}</span>
              </button>
            </React.Fragment>
          ))}
        </nav>

        <main className='nmain'>
          <header className='ntop'>
            <div><h1>{cur[1]}</h1><p>{cur[3]}</p></div>
            <div className='ntools'>
              {showMonth && <Month />}
              {nav !== 'settings' && <>
                <button className='btn iri nbtn' onClick={() => setForm('sale')}>+ Sale</button>
                <button className='btn glass nbtn' onClick={() => setForm('expense')}>+ Expense</button>
              </>}
              <button className='dpill' onClick={onExit}>Sign out</button>
            </div>
          </header>
          <div key={nav} className='nview'>{views[nav]()}</div>
        </main>
      </div>
      {form && <RecordSheet type={form} onClose={() => setForm(null)} onSave={save} />}
    </div>
  );
}

function App() {
  const [mode, setMode] = useState(null);
  const [view, setView] = useState('welcome');
  useEffect(() => { document.body.classList.toggle('inapp', view === 'app'); window.scrollTo(0, 0); }, [view]);
  const [dark, setDark] = useState(false);
  const setTheme = (enabled) => { setDark(enabled); document.documentElement.dataset.theme = enabled ? "dark" : "light"; };
  useEffect(() => {
    const t = localStorage.getItem(TOKEN_KEY);
    if (!t) return;
    call("/me/", null, t).then(() => setView('app')).catch((e) => { if (!/reach/.test(e.message)) localStorage.removeItem(TOKEN_KEY); });
  }, []);
  const signOut = () => {
    const t = localStorage.getItem(TOKEN_KEY);
    localStorage.removeItem(TOKEN_KEY);
    if (t) call("/auth/logout/", {}, t).catch(() => {});
    setTheme(false); setView('welcome');
  };
  if (view === 'app') return <Dashboard dark={dark} setTheme={setTheme} onExit={signOut} />;
  return (
    <>
      <nav>
        <div className="logo"><i />Nexa</div>
        <div style={{ display: "flex", gap: 10 }}>
          <button className="btn glass" onClick={() => setMode("signin")}>Sign in</button>
        </div>
      </nav>
      <main className="hero">
        <span className="tag">Business intelligence, reimagined</span>
        <h1>Run your business with <em>foresight</em></h1>
        <p className="sub">Record every sale, purchase and expense in one place. Nexa shows what sells most, how each month is going, and what to do next.</p>
        <div className="cta">
          <button className="btn iri" onClick={() => setMode("signup")}>Get started</button>
          <button className="btn glass" onClick={() => setMode("signin")}>I have an account</button>
        </div>
        <div className="pills">
          <span className="pill">Sales and stock tracking</span>
          <span className="pill">Smart strategy ideas</span>
          <span className="pill">Monthly forecasts</span>
        </div>
      </main>
      <section className="steps" aria-labelledby="how">
        <h2 id="how" className="stitle">Up and running in minutes</h2>
        <div className="stepgrid">
          {[["Record your business", "Log sales, purchases and expenses in seconds."], ["See what is working", "Best sellers, margins and monthly trends, always up to date."], ["Act on smart ideas", "Forecasts and strategy tips show you what to do next."]].map(([t, d], i) => (
            <div className="step" key={t}><b>{i + 1}</b><h3>{t}</h3><p>{d}</p></div>
          ))}
        </div>
      </section>
      <aside className="float f1" aria-hidden="true"><span>Best seller this month</span><b>Earbuds</b><div className="mini"><i /></div></aside>
      <aside className="float f2" aria-hidden="true"><span>Next month forecast</span><b>+8% expected</b></aside>
      {mode && <Sheet mode={mode} onClose={() => setMode(null)} onEnter={() => { setMode(null); setView('app'); }} onSwitch={setMode} />}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

/* live orb: gentle pointer parallax, paused for reduced motion */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const video = document.getElementById("orb");
if (reduce) { video.removeAttribute("autoplay"); video.pause(); }
else {
  const p = video.play(); if (p && p.catch) p.catch(() => {});
  addEventListener("pointermove", (e) => {
    const r = document.documentElement.style;
    r.setProperty("--px", ((e.clientX / innerWidth - .5) * 28) + "px");
    r.setProperty("--py", ((e.clientY / innerHeight - .5) * 20) + "px");
  });
}
</script>
</body>
</html>
