# Render Blueprint: the Nexa API web service and its PostgreSQL database.
# In Render, choose New > Blueprint and select this repository.
# Paid database plan: Render's free PostgreSQL expires after 30 days, which would delete the data.
databases:
  - name: nexa-db
    databaseName: nexa
    user: nexa
    plan: basic-256mb

services:
  - type: web
    name: nexa-api
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn nexa.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: NEXA_DEBUG
        value: "0"
      - key: NEXA_SECRET_KEY
        generateValue: true
      - key: NEXA_ALLOWED_HOSTS
        value: api.Nexa-app.com,nexa-api.onrender.com
      - key: NEXA_CORS_ORIGINS
        value: https://app.Nexa.com
      - key: NEXA_FRONTEND_URL
        value: https://app.Nexa.com/Nexa.html
      - key: NEXA_DATABASE_URL
        fromDatabase:
          name: nexa-db
          property: connectionString
